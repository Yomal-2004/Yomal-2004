<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100" role="img" aria-label="Small robot walking back and forth along a line" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Courier New', Consolas, monospace; }
    .run { animation: run 14s linear infinite; }
    @keyframes run {
      0%   { transform: translateX(0) scaleX(1); }
      48%  { transform: translateX(680px) scaleX(1); }
      50%  { transform: translateX(680px) scaleX(-1); }
      98%  { transform: translateX(0) scaleX(-1); }
      100% { transform: translateX(0) scaleX(1); }
    }
    .bob { animation: bob .3s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
    .legA { animation: step .6s ease-in-out infinite alternate; }
    .legB { animation: step .6s ease-in-out infinite alternate-reverse; }
    @keyframes step { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
    .pulse { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 3s infinite; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  </style>

  <text x="400" y="34" font-size="14" fill="#64748b" text-anchor="middle">learn.build.grow()</text>
  <line x1="20" y1="86" x2="780" y2="86" stroke="#334155" stroke-width="2" stroke-dasharray="6 8"/>

  <g transform="translate(60,70)">
    <g class="run">
      <g class="bob">
        <!-- legs (hip pivots) -->
        <g transform="translate(-6,8)"><g class="legA">
          <rect x="-3" y="0" width="6" height="12" rx="3" fill="#475569"/>
          <rect x="-4" y="10" width="11" height="5" rx="2.5" fill="#22d3ee"/>
        </g></g>
        <g transform="translate(6,8)"><g class="legB">
          <rect x="-3" y="0" width="6" height="12" rx="3" fill="#475569"/>
          <rect x="-4" y="10" width="11" height="5" rx="2.5" fill="#22d3ee"/>
        </g></g>
        <!-- body -->
        <rect x="-13" y="-12" width="26" height="22" rx="6" fill="#1e293b" stroke="url(#glow)" stroke-width="2"/>
        <circle class="pulse" cx="0" cy="-2" r="3" fill="#22d3ee"/>
        <!-- head -->
        <line x1="0" y1="-38" x2="0" y2="-32" stroke="#38bdf8" stroke-width="2"/>
        <circle class="pulse" cx="0" cy="-41" r="3" fill="#f43f5e"/>
        <rect x="-15" y="-34" width="30" height="22" rx="7" fill="#1e293b" stroke="url(#glow)" stroke-width="2"/>
        <rect class="blink" x="-8" y="-27" width="5" height="6" rx="2" fill="#22d3ee"/>
        <rect class="blink" x="3" y="-27" width="5" height="6" rx="2" fill="#22d3ee"/>
      </g>
    </g>
  </g>
</svg>
