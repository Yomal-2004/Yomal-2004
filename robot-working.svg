<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Animated robot typing code at a laptop while gears turn" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Courier New', Consolas, monospace; }
    .pulse { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    .bob { animation: bob 2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

    .typeA { animation: typeA .5s ease-in-out infinite alternate; }
    @keyframes typeA { from { transform: rotate(18deg); } to { transform: rotate(27deg); } }
    .typeB { animation: typeB .5s ease-in-out .25s infinite alternate; }
    @keyframes typeB { from { transform: rotate(11deg); } to { transform: rotate(18deg); } }

    .ln { transform-box: fill-box; transform-origin: left center; animation: ln 6s ease-in-out infinite; }
    @keyframes ln { 0% { transform: scaleX(0); } 14%,86% { transform: scaleX(1); } 100% { transform: scaleX(0); } }

    .bit { opacity: 0; animation: bit 3s ease-out infinite; }
    @keyframes bit { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: .9; } 100% { opacity: 0; transform: translateY(-60px); } }

    .spin { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
    .spinr { transform-box: fill-box; transform-origin: center; animation: spin 4s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bar { transform-box: fill-box; transform-origin: center bottom; animation: bar 2.4s ease-in-out infinite; }
    @keyframes bar { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

    .prog { transform-box: fill-box; transform-origin: left center; animation: prog 5s ease-in-out infinite; }
    @keyframes prog { 0% { transform: scaleX(.02); } 85%,100% { transform: scaleX(1); } }
  </style>

  <rect x="1" y="1" width="798" height="298" rx="20" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <text x="24" y="34" font-size="14" fill="#64748b">// robot.work()</text>

  <!-- mini bar chart (data) -->
  <line x1="30" y1="200" x2="118" y2="200" stroke="#334155" stroke-width="2"/>
  <g fill="#2563eb">
    <rect class="bar" x="36" y="150" width="12" height="50" rx="3"/>
    <rect class="bar" x="56" y="130" width="12" height="70" rx="3" style="animation-delay:.4s" fill="#22d3ee"/>
    <rect class="bar" x="76" y="160" width="12" height="40" rx="3" style="animation-delay:.8s"/>
    <rect class="bar" x="96" y="120" width="12" height="80" rx="3" style="animation-delay:1.2s" fill="#22d3ee"/>
  </g>
  <text x="36" y="220" font-size="12" fill="#64748b">data</text>

  <!-- robot (behind desk) -->
  <g transform="translate(190,170)">
    <g class="bob">
      <line x1="0" y1="-98" x2="0" y2="-72" stroke="#38bdf8" stroke-width="3"/>
      <circle class="pulse" cx="0" cy="-104" r="6" fill="#22c55e"/>
      <rect x="-56" y="-48" width="10" height="24" rx="5" fill="#334155"/>
      <rect x="46" y="-48" width="10" height="24" rx="5" fill="#334155"/>
      <rect x="-46" y="-72" width="92" height="70" rx="18" fill="#1e293b" stroke="url(#glow)" stroke-width="3"/>
      <rect x="-34" y="-58" width="68" height="34" rx="12" fill="#0b1220"/>
      <!-- eyes look toward the screen -->
      <rect class="blink" x="-14" y="-47" width="12" height="12" rx="4" fill="#22d3ee"/>
      <rect class="blink" x="18" y="-47" width="12" height="12" rx="4" fill="#22d3ee"/>
      <path d="M-4 -14 Q8 -8 20 -14" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="-8" y="-2" width="16" height="9" fill="#334155"/>
      <rect x="-40" y="6" width="80" height="80" rx="16" fill="#1e293b" stroke="url(#glow)" stroke-width="3"/>
      <circle cx="-14" cy="30" r="9" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
      <circle class="pulse" cx="-14" cy="30" r="3.5" fill="#22d3ee"/>
      <rect x="-26" y="52" width="40" height="5" rx="2.5" fill="#334155"/>
      <!-- typing arms -->
      <g transform="translate(36,24)"><g class="typeA">
        <rect x="0" y="-7" width="96" height="14" rx="7" fill="#334155"/>
        <circle cx="98" cy="0" r="8" fill="#22d3ee"/>
      </g></g>
      <g transform="translate(36,42)"><g class="typeB">
        <rect x="0" y="-7" width="96" height="14" rx="7" fill="#475569"/>
        <circle cx="98" cy="0" r="8" fill="#38bdf8"/>
      </g></g>
    </g>
  </g>

  <!-- desk -->
  <rect x="30" y="238" width="740" height="10" rx="5" fill="#1e293b" stroke="#334155"/>

  <!-- laptop -->
  <rect x="310" y="96" width="210" height="128" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="415" cy="104" r="2" fill="#38bdf8"/>
  <rect x="296" y="226" width="238" height="12" rx="6" fill="#334155"/>

  <!-- code lines (typing) -->
  <g>
    <rect class="ln" x="326" y="116" width="90" height="7" rx="3.5" fill="#22d3ee"/>
    <rect class="ln" x="342" y="132" width="140" height="7" rx="3.5" fill="#a78bfa" style="animation-delay:.3s"/>
    <rect class="ln" x="342" y="148" width="100" height="7" rx="3.5" fill="#34d399" style="animation-delay:.6s"/>
    <rect class="ln" x="358" y="164" width="110" height="7" rx="3.5" fill="#f472b6" style="animation-delay:.9s"/>
    <rect class="ln" x="342" y="180" width="70" height="7" rx="3.5" fill="#fbbf24" style="animation-delay:1.2s"/>
    <rect class="ln" x="326" y="196" width="120" height="7" rx="3.5" fill="#22d3ee" style="animation-delay:1.5s"/>
  </g>

  <!-- rising data bits -->
  <g font-size="16" fill="#22d3ee">
    <text class="bit" x="340" y="90">01</text>
    <text class="bit" x="400" y="90" style="animation-delay:1s">10</text>
    <text class="bit" x="460" y="90" style="animation-delay:2s">11</text>
    <text class="bit" x="500" y="90" style="animation-delay:.5s">0</text>
  </g>

  <!-- gears -->
  <g>
    <circle class="spin" cx="640" cy="110" r="30" fill="none" stroke="#38bdf8" stroke-width="12" stroke-dasharray="9.42 9.42"/>
    <circle cx="640" cy="110" r="23" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="640" cy="110" r="8" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>

    <circle class="spinr" cx="706" cy="154" r="20" fill="none" stroke="#2563eb" stroke-width="9" stroke-dasharray="6.28 6.28"/>
    <circle cx="706" cy="154" r="14" fill="#1e293b" stroke="#2563eb" stroke-width="3"/>
    <circle cx="706" cy="154" r="5" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
  </g>

  <!-- training progress -->
  <text x="570" y="212" font-size="13" fill="#94a3b8">model.fit(X, y)</text>
  <rect x="570" y="220" width="190" height="8" rx="4" fill="#1e293b"/>
  <rect class="prog" x="570" y="220" width="190" height="8" rx="4" fill="url(#glow)"/>
</svg>
