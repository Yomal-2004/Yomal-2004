<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Animated robot assistant waving hello" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Courier New', Consolas, monospace; }
    .float { animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 3s ease-in-out infinite; }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .35; } 50% { transform: scaleX(.8); opacity: .18; } }
    .wave { animation: wave 1.4s ease-in-out infinite; }
    @keyframes wave { 0%,100% { transform: rotate(-80deg); } 50% { transform: rotate(-30deg); } }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    .pulse { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .m { opacity: 0; animation: show 12s infinite; }
    .m2 { animation-delay: 4s; }
    .m3 { animation-delay: 8s; }
    @keyframes show { 0% { opacity: 0; } 4%,30% { opacity: 1; } 34%,100% { opacity: 0; } }
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .1; } 50% { opacity: .8; } }
    .chip { animation: chip 6s ease-in-out infinite; }
    @keyframes chip { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  </style>

  <rect x="1" y="1" width="798" height="258" rx="20" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <!-- twinkling particles -->
  <g fill="#22d3ee">
    <circle class="tw" cx="60" cy="40" r="2.5"/>
    <circle class="tw" cx="250" cy="60" r="2" style="animation-delay:.6s"/>
    <circle class="tw" cx="110" cy="210" r="2" style="animation-delay:1.2s"/>
    <circle class="tw" cx="760" cy="230" r="2.5" style="animation-delay:1.8s"/>
    <circle class="tw" cx="770" cy="30" r="2" style="animation-delay:2.2s"/>
    <circle class="tw" cx="280" cy="220" r="2.5" style="animation-delay:.9s"/>
  </g>

  <!-- shadow -->
  <ellipse class="shadow" cx="170" cy="252" rx="52" ry="5" fill="#000"/>

  <!-- robot -->
  <g transform="translate(170,138)">
    <g class="float">
      <!-- antenna -->
      <line x1="0" y1="-98" x2="0" y2="-72" stroke="#38bdf8" stroke-width="3"/>
      <circle class="pulse" cx="0" cy="-104" r="6" fill="#f43f5e"/>
      <!-- ears -->
      <rect x="-56" y="-48" width="10" height="24" rx="5" fill="#334155"/>
      <rect x="46" y="-48" width="10" height="24" rx="5" fill="#334155"/>
      <!-- head -->
      <rect x="-46" y="-72" width="92" height="70" rx="18" fill="#1e293b" stroke="url(#glow)" stroke-width="3"/>
      <rect x="-34" y="-58" width="68" height="34" rx="12" fill="#0b1220"/>
      <rect class="blink" x="-22" y="-47" width="12" height="12" rx="4" fill="#22d3ee"/>
      <rect class="blink" x="10" y="-47" width="12" height="12" rx="4" fill="#22d3ee"/>
      <path d="M-12 -14 Q0 -6 12 -14" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- neck -->
      <rect x="-8" y="-2" width="16" height="9" fill="#334155"/>
      <!-- legs -->
      <rect x="-26" y="76" width="18" height="22" rx="6" fill="#334155"/>
      <rect x="8" y="76" width="18" height="22" rx="6" fill="#334155"/>
      <rect x="-30" y="94" width="26" height="10" rx="5" fill="#22d3ee"/>
      <rect x="4" y="94" width="26" height="10" rx="5" fill="#22d3ee"/>
      <!-- left arm -->
      <rect x="-62" y="14" width="16" height="52" rx="8" fill="#334155"/>
      <circle cx="-54" cy="70" r="9" fill="#22d3ee"/>
      <!-- body -->
      <rect x="-40" y="6" width="80" height="72" rx="16" fill="#1e293b" stroke="url(#glow)" stroke-width="3"/>
      <circle cx="0" cy="30" r="10" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
      <circle class="pulse" cx="0" cy="30" r="4" fill="#22d3ee"/>
      <rect x="-22" y="50" width="44" height="5" rx="2.5" fill="#334155"/>
      <rect x="-22" y="60" width="28" height="5" rx="2.5" fill="#334155"/>
      <!-- waving arm -->
      <g transform="translate(40,22)">
        <g class="wave">
          <rect x="0" y="-8" width="44" height="16" rx="8" fill="#334155"/>
          <circle cx="48" cy="0" r="9" fill="#22d3ee"/>
        </g>
      </g>
    </g>
  </g>

  <!-- speech bubble -->
  <rect x="300" y="36" width="440" height="100" rx="16" fill="#0b1220" stroke="url(#glow)" stroke-width="2"/>
  <polygon points="300,72 280,86 300,100" fill="#0b1220" stroke="url(#glow)" stroke-width="2"/>
  <rect x="299" y="74" width="4" height="24" fill="#0b1220"/>

  <g class="m">
    <text x="326" y="82" font-size="22" fill="#e2e8f0">Hello! I'm Yomal's</text>
    <text x="326" y="112" font-size="22" fill="#22d3ee">portfolio assistant.</text>
  </g>
  <g class="m m2">
    <text x="326" y="82" font-size="21" fill="#e2e8f0">BSc (Hons) Data Science</text>
    <text x="326" y="112" font-size="18" fill="#22d3ee">Sri Lanka Technological Campus</text>
  </g>
  <g class="m m3">
    <text x="326" y="82" font-size="19" fill="#e2e8f0">Open to internships, open source</text>
    <text x="326" y="112" font-size="19" fill="#22d3ee">and research collaboration.</text>
  </g>

  <!-- quick-reply chips (mirrors the portfolio chat assistant) -->
  <g class="chip" font-size="13" text-anchor="middle" fill="#e2e8f0">
    <rect x="300" y="156" width="76" height="26" rx="13" fill="#1e293b" stroke="#2563eb"/>
    <text x="338" y="173">Skills</text>
    <rect x="388" y="156" width="100" height="26" rx="13" fill="#1e293b" stroke="#2563eb"/>
    <text x="438" y="173">Projects</text>
    <rect x="500" y="156" width="104" height="26" rx="13" fill="#1e293b" stroke="#2563eb"/>
    <text x="552" y="173">Education</text>
    <rect x="616" y="156" width="124" height="26" rx="13" fill="#1e293b" stroke="#2563eb"/>
    <text x="678" y="173">Certifications</text>
  </g>

  <!-- status -->
  <circle class="pulse" cx="308" cy="214" r="5" fill="#22c55e"/>
  <text x="324" y="219" font-size="14" fill="#94a3b8">Online | Interactive Guide</text>
</svg>
