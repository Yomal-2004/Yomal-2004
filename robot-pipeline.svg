<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Animated robot arm cleaning raw data boxes on a conveyor belt and loading them into a database" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Courier New', Consolas, monospace; }
    .pulse { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

    /* boxes travel left to right, turning from RAW (red) to OK (green) under the arm */
    .box, .bx, .raw, .ok { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .box { animation-name: move; }
    .bx  { animation-name: ready; }
    .raw { animation-name: rawfade; }
    .ok  { animation-name: okfade; }
    @keyframes move { 0% { transform: translateX(0); opacity: 0; } 4% { opacity: 1; } 96% { opacity: 1; } 100% { transform: translateX(660px); opacity: 0; } }
    @keyframes ready { 0%,49.9% { fill: #f43f5e; } 50%,100% { fill: #22c55e; } }
    @keyframes rawfade { 0%,49.9% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes okfade { 0%,49.9% { opacity: 0; } 50%,100% { opacity: 1; } }
    .b2, .b2 .bx, .b2 .raw, .b2 .ok { animation-delay: -3s; }
    .b3, .b3 .bx, .b3 .raw, .b3 .ok { animation-delay: -6s; }

    /* robot arm cycle matches one box every 3s */
    .a1 { animation: a1 3s ease-in-out infinite; }
    .a2 { animation: a2 3s ease-in-out infinite; }
    @keyframes a1 { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(0deg); } }
    @keyframes a2 { 0%,100% { transform: rotate(24deg); } 50% { transform: rotate(0deg); } }
    .beam { opacity: 0; animation: beam 3s ease-in-out infinite; }
    @keyframes beam { 0%,35%,65%,100% { opacity: 0; } 50% { opacity: .4; } }

    .belt { animation: belt 1s linear infinite; }
    @keyframes belt { from { stroke-dashoffset: 28; } to { stroke-dashoffset: 0; } }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <rect x="1" y="1" width="798" height="238" rx="20" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <!-- status text -->
  <circle class="pulse" cx="32" cy="58" r="5" fill="#22c55e"/>
  <text x="46" y="63" font-size="14" fill="#94a3b8">etl_robot.run()</text>
  <text x="776" y="63" font-size="14" fill="#94a3b8" text-anchor="end">ingest -> clean -> load</text>

  <!-- ceiling rail -->
  <rect x="20" y="14" width="760" height="14" rx="7" fill="#1e293b" stroke="#334155"/>

  <!-- conveyor belt -->
  <rect x="20" y="172" width="760" height="14" rx="7" fill="#1e293b" stroke="#334155"/>
  <line class="belt" x1="34" y1="179" x2="766" y2="179" stroke="#475569" stroke-width="2" stroke-dasharray="14 14"/>
  <circle class="wheel" cx="34" cy="198" r="9" fill="#0b1220" stroke="#38bdf8" stroke-width="3" stroke-dasharray="7 7"/>
  <circle class="wheel" cx="400" cy="198" r="9" fill="#0b1220" stroke="#38bdf8" stroke-width="3" stroke-dasharray="7 7"/>
  <circle class="wheel" cx="766" cy="198" r="9" fill="#0b1220" stroke="#38bdf8" stroke-width="3" stroke-dasharray="7 7"/>

  <!-- data boxes -->
  <g transform="translate(40,128)">
    <g class="box b1">
      <rect class="bx" width="60" height="44" rx="6" fill="#f43f5e" stroke="#0b1220" stroke-width="2"/>
      <text class="raw" x="30" y="28" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">RAW</text>
      <text class="ok" x="30" y="28" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">OK</text>
    </g>
  </g>
  <g transform="translate(40,128)">
    <g class="box b2">
      <rect class="bx" width="60" height="44" rx="6" fill="#f43f5e" stroke="#0b1220" stroke-width="2"/>
      <text class="raw" x="30" y="28" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">RAW</text>
      <text class="ok" x="30" y="28" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">OK</text>
    </g>
  </g>
  <g transform="translate(40,128)">
    <g class="box b3">
      <rect class="bx" width="60" height="44" rx="6" fill="#f43f5e" stroke="#0b1220" stroke-width="2"/>
      <text class="raw" x="30" y="28" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">RAW</text>
      <text class="ok" x="30" y="28" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">OK</text>
    </g>
  </g>

  <!-- database -->
  <path d="M712 122 v38 c0 7 13 12 30 12 s30-5 30-12 v-38" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <ellipse cx="742" cy="122" rx="30" ry="10" fill="#0b1220" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="742" y="152" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">DB</text>
  <circle class="pulse" cx="742" cy="164" r="3" fill="#22c55e"/>

  <!-- robot arm -->
  <g transform="translate(400,28)">
    <g class="a1">
      <rect x="-9" y="0" width="18" height="50" rx="8" fill="#334155"/>
      <circle cx="0" cy="50" r="10" fill="#22d3ee"/>
      <g transform="translate(0,50)">
        <g class="a2">
          <rect x="-7" y="0" width="14" height="44" rx="6" fill="#475569"/>
          <rect x="-14" y="42" width="28" height="10" rx="3" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
          <polygon class="beam" points="-12,52 12,52 24,94 -24,94" fill="#22d3ee"/>
          <circle class="pulse" cx="0" cy="47" r="2.5" fill="#22d3ee"/>
        </g>
      </g>
    </g>
  </g>
  <circle cx="400" cy="28" r="8" fill="#22d3ee" stroke="#0b1220" stroke-width="2"/>

  <!-- stage labels -->
  <text x="70" y="226" font-size="13" fill="#64748b" text-anchor="middle">INGEST</text>
  <text x="400" y="226" font-size="13" fill="#64748b" text-anchor="middle">CLEAN</text>
  <text x="742" y="226" font-size="13" fill="#64748b" text-anchor="middle">LOAD</text>
</svg>
